name: Deploy — Nightly (12 AM)

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  deploy-admin:
    name: Deploy Admin
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Admin
        run: curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_ADMIN }}"

  deploy-brand:
    name: Deploy Brand
    runs-on: ubuntu-latest
    needs: [deploy-admin]
    steps:
      - name: Trigger Brand
        run: curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_BRAND }}"

  deploy-vendor:
    name: Deploy Vendor
    runs-on: ubuntu-latest
    needs: [deploy-brand]
    steps:
      - name: Trigger Vendor
        run: curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_VENDOR }}"

  deploy-manager:
    name: Deploy Manager
    runs-on: ubuntu-latest
    needs: [deploy-vendor]
    steps:
      - name: Trigger Manager
        run: curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_MANAGER }}"

  deploy-developer:
    name: Deploy Developer
    runs-on: ubuntu-latest
    needs: [deploy-manager]
    steps:
      - name: Trigger Developer
        run: curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_DEVELOPER }}"
